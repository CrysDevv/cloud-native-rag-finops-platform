groups:
  - name: rag-api
    rules:
      - alert: ApiCaida
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "La API FastAPI no responde al scraping de Prometheus"

      - alert: ApiTasaErrores5xxAlta
        expr: |
          sum(rate(http_requests_total{estado=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Más del 5 % de las solicitudes terminan en error 5xx"

      - alert: ApiLimiteDeTasaActivo
        expr: sum(rate(http_rate_limited_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El rate limiting por Redis está rechazando solicitudes de forma sostenida"

      - alert: ConsultasRagLatenciaP95Alta
        expr: histogram_quantile(0.95, sum(rate(rag_consulta_duracion_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La latencia p95 de consultas RAG supera 2 segundos"

  - name: rag-worker
    rules:
      - alert: WorkerCaido
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "El worker de ingesta no responde al scraping de Prometheus"

      - alert: IngestaConErroresPermanentes
        expr: sum(increase(ingesta_documentos_total{resultado="error_permanente"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Documentos fallaron de forma permanente durante la ingesta"

      - alert: IngestaConErroresTransitoriosSostenidos
        expr: sum(increase(ingesta_documentos_total{resultado="error_transitorio"}[15m])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Errores transitorios repetidos en la ingesta; riesgo de envío a la DLQ"
